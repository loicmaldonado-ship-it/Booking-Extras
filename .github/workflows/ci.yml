name: Qualité du code
on:
  push:
    branches:
      - elea
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Only deployable packages: 2026-10-20 audit reports high findings in
      # ESLint-related devDependencies and moderate findings in ExcelJS.
      # New high/critical production advisories must block merges.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
